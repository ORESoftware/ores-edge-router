name: ci
on:
  push: { branches: [main, dev] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/validate-config.mjs examples/*.json
      - run: node scripts/render-wrangler.mjs examples/apostille-me.router.config.json --out /tmp/w.toml && test -s /tmp/w.toml
