name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: edge-router-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Unit and repository-hygiene tests
        run: npm test

      - name: Validate example configurations
        run: node scripts/validate-config.mjs examples/*.json

      - name: Render a representative Wrangler configuration
        run: |
          node scripts/render-wrangler.mjs examples/apostille-me.router.config.json --out /tmp/w.toml
          test -s /tmp/w.toml
